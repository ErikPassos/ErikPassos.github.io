<!doctype html>
<html lang="{{ site.lang | default: 'pt-BR' }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta id="theme-color" name="theme-color" content="#155799">

  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('site-theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var initialTheme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : (systemDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', initialTheme);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }());
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>

  <button
    id="theme-toggle"
    class="theme-toggle"
    type="button"
    aria-label="Ativar tema escuro"
    aria-pressed="false"
    title="Ativar tema escuro"
  >
    <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
    <span class="theme-toggle__text">Tema escuro</span>
  </button>

  <header class="page-header" role="banner">
    <h1 class="project-name">{{ site.title }}</h1>
    {% if site.description %}
      <p class="project-tagline">{{ site.description }}</p>
    {% endif %}
  </header>

  <main id="main-content" class="main-content" role="main" tabindex="-1">
    {{ content }}

    <footer class="site-footer">
      <span>Conteúdo desenvolvido por Erik F. B. Passos.</span>
    </footer>
  </main>

  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
